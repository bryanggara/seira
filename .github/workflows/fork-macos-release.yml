# Fork-only: publishes every new upstream Seira release for macOS as an unofficial release in this fork.
#
# - Runs every 2 hours, or by hand (`tag` to pick an upstream tag).
# - Skips a tag that already has a `<tag>-mac.N` release here.
# - Builds with fork-macos-updatable.yml: the self-signed apps whose update feed is this fork, so apps
#   installed from v0.1.194-mac.2 on keep updating themselves. An ad-hoc build here would break that chain.
# - Uses only GITHUB_TOKEN. Releases made with it do not trigger other workflows (npm-publish, milestones).
# - Turn off: `gh workflow disable fork-macos-release.yml -R bryanggara/seira`.
name: Fork macOS release

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build, like v0.1.195. Empty takes the latest upstream release.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: fork-macos-release
  cancel-in-progress: false

env:
  UPSTREAM: seira-bot/seira
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  release:
    if: github.repository == 'bryanggara/seira'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Pick the upstream release
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Upstream tag '$tag' does not look like v1.2.3."
            exit 1
          fi
          done_already=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name | startswith(\"$tag-mac.\"))] | length")
          skip=false
          if [ "$done_already" != 0 ]; then
            skip=true
            echo "\`$tag\` already has a release here; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "tag=$tag"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"
          echo "Upstream $tag; skip=$skip"

      - name: Build and publish with Fork macOS updatable build
        if: steps.pick.outputs.skip != 'true'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          since=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run fork-macos-updatable.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG" -f publish=true -f suffix=mac.1
          run=""
          for _ in $(seq 1 30); do
            sleep 10
            run=$(gh run list -w fork-macos-updatable.yml --event workflow_dispatch -L 5 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$since\")] | first | .databaseId // empty")
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "::error::The build run did not show up within 5 minutes."; exit 1; }
          echo "Build run: https://github.com/$GH_REPO/actions/runs/$run" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run" --interval 60 --exit-status > /dev/null
          echo "Published \`$TAG-mac.1\`." >> "$GITHUB_STEP_SUMMARY"
